name: Verify 2.1.23 client GUI
on: [push, pull_request]
jobs:
  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare software OpenGL display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - name: Render journal, actions, help and construction screens
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          ALSOFT_DRIVERS: 'null'
        run: |
          mkdir -p run
          printf 'onboardAccessibility:false\nlang:ru_ru\n' > run/options.txt
          timeout --signal=INT --kill-after=15s 600s xvfb-run -a ./gradlew runClient -PguiSmoke --console=plain --no-daemon > gui-smoke.log 2>&1 || status=$?
          tail -n 80 gui-smoke.log
          if ! grep -q 'CART_GUI_CLIENT_OK' gui-smoke.log || grep -qE 'CART_GUI_CLIENT_FAILED|MixinApplyError|MixinTransformerError' gui-smoke.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-gui-verification
          path: |
            gui-smoke.log
            run/screenshots/*.png
            run/crash-reports/*.txt
