name: Verify preparation for 2.2.0

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      # check/build depend on release obfuscation. Preparation deliberately runs only these tasks.
      - name: Compile and verify detached pipelines and Create preflight
        id: compile
        run: |
          set -o pipefail
          ./gradlew compileJava compileCreateSmokeJava testAsyncPipeline testCreatePreflight verifyMixinSafety --console=plain --no-daemon 2>&1 | tee compile.log
      - name: Native Create regression
        timeout-minutes: 10
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          timeout --signal=INT --kill-after=15s 150s ./gradlew runServer -PcreateSmoke --console=plain --no-daemon > create-smoke.log 2>&1 || status=$?
          tail -n 100 create-smoke.log
          if ! grep -q 'AVILIX_CREATE_SMOKE_OK' create-smoke.log || grep -qE '(AVILIX_CREATE_SMOKE_FAILED|Failed to start the minecraft server|MixinApplyError|MixinTransformerError)' create-smoke.log; then
            exit 1
          fi
      - name: Native regression without Create
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          timeout --signal=INT --kill-after=15s 150s ./gradlew runServer -PcreateAbsent --console=plain --no-daemon > create-absent-smoke.log 2>&1 || status=$?
          tail -n 80 create-absent-smoke.log
          if ! grep -q 'CREATE_ABSENT_NATIVE_OK' create-absent-smoke.log || grep -qE '(Failed to start the minecraft server|MixinApplyError|MixinTransformerError)' create-absent-smoke.log; then
            exit 1
          fi
      - name: Verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: |
            compile.log
            *smoke.log
          if-no-files-found: ignore
