name: Verify AvilixLogger development

on: [push, pull_request]

jobs:
  verify:
    name: verify (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: current-fd132, fd: '1.3.2', create: '6.0.11-313', ae2: '19.2.12', framework: '1.21.1-0.13.10'}
          - {profile: current-fd134, fd: '1.3.4', create: '6.0.11-313', ae2: '19.2.12', framework: '1.21.1-0.13.10'}
          - {profile: logged-pack, fd: '1.3.2', create: '6.0.10-281', ae2: '19.2.18', framework: '1.21.1-0.13.11'}
          # Matches the main module versions inventoried on the live Windows s4 client (JARs may differ by SHA-256).
          - {profile: client-s4-core, fd: '1.3.4', create: '6.0.10-281', ae2: '19.2.18', framework: '1.21.1-0.13.11'}
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_compatCreateVersion: ${{ matrix.create }}
      ORG_GRADLE_PROJECT_compatAe2Version: ${{ matrix.ae2 }}
      ORG_GRADLE_PROJECT_compatFrameworkVersion: ${{ matrix.framework }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      # check/build depend on release obfuscation. Preparation deliberately runs only these tasks.
      - name: Compile and verify detached pipelines and Create preflight
        id: compile
        run: |
          set -o pipefail
          ./gradlew compileJava compileCreateSmokeJava testAsyncPipeline testCreatePreflight verifyMixinSafety --console=plain --no-daemon 2>&1 | tee compile.log
      - name: Native Create regression
        timeout-minutes: 10
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          # Startup smoke cases run synchronously; the outer timeout bounds the stand.
          printf 'max-tick-time=-1\n' > run/server.properties
          timeout --signal=INT --kill-after=15s 360s ./gradlew runServer -PcreateSmoke -PfdSmokeVersion=${{ matrix.fd }} --console=plain --no-daemon > create-smoke.log 2>&1 || status=$?
          tail -n 100 create-smoke.log
          if ! grep -q 'AVILIX_CREATE_SMOKE_OK' create-smoke.log || grep -qE '(AVILIX_CREATE_SMOKE_FAILED|Failed to start the minecraft server|MixinApplyError|MixinTransformerError)' create-smoke.log; then
            exit 1
          fi
      - name: Native regression without Create
        if: ${{ !cancelled() && steps.compile.outcome == 'success' && matrix.fd == '1.3.4' }}
        timeout-minutes: 10
        run: |
          mkdir -p run-create-absent
          printf 'eula=true\n' > run-create-absent/eula.txt
          timeout --signal=INT --kill-after=15s 150s ./gradlew runServer -PcreateAbsent --console=plain --no-daemon > create-absent-smoke.log 2>&1 || status=$?
          tail -n 80 create-absent-smoke.log
          if ! grep -q 'CREATE_ABSENT_NATIVE_OK' create-absent-smoke.log || grep -qE '(Failed to start the minecraft server|MixinApplyError|MixinTransformerError)' create-absent-smoke.log; then
            exit 1
          fi
      - name: Native Backpacked regression
        if: ${{ !cancelled() && steps.compile.outcome == 'success' && (matrix.fd == '1.3.4' || matrix.profile == 'logged-pack') }}
        timeout-minutes: 5
        run: |
          timeout --signal=INT --kill-after=15s 150s ./gradlew runServer -PbackpackSmoke --console=plain --no-daemon > backpack-smoke.log 2>&1 || status=$?
          tail -n 50 backpack-smoke.log
          if ! grep -q 'BACKPACK_NATIVE_SMOKE_OK' backpack-smoke.log || grep -qE 'Backpack smoke failed|MixinApplyError|MixinTransformerError' backpack-smoke.log; then exit 1; fi
      - name: Native actor and aircraft regression
        if: ${{ !cancelled() && steps.compile.outcome == 'success' && matrix.fd == '1.3.4' }}
        timeout-minutes: 5
        run: |
          timeout --signal=INT --kill-after=15s 150s ./gradlew runServer -PactorSmoke --console=plain --no-daemon > actor-smoke.log 2>&1 || status=$?
          tail -n 50 actor-smoke.log
          if ! grep -q 'ACTOR_ATTRIBUTION_NATIVE_OK' actor-smoke.log || grep -qE 'ACTOR_ATTRIBUTION_NATIVE_FAILED|MixinApplyError|MixinTransformerError' actor-smoke.log; then exit 1; fi
      - name: Verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs-${{ matrix.profile }}
          path: |
            compile.log
            *smoke.log
            run/crash-reports/*.txt
          if-no-files-found: ignore
