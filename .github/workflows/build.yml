name: Build AvilixLogger

on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, test and obfuscate
        run: ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx3G clean build compileCreateSmokeJava
      - name: Native Create recovery and rollback smoke
        timeout-minutes: 10
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          timeout --signal=INT --kill-after=30s 480s ./gradlew --no-daemon -PcreateSmoke runServer --console=plain > create-smoke.log 2>&1 || true
          tail -n 120 create-smoke.log
          grep -q 'AVILIX_CREATE_SMOKE_OK' create-smoke.log
          if grep -qE '(AVILIX_CREATE_SMOKE_FAILED|MixinApplyError|MixinTransformerError|Failed to start the minecraft server)' create-smoke.log; then exit 1; fi
      - name: Real client minecart GUI checks
        timeout-minutes: 10
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri; fi
          mkdir -p run
          printf 'onboardAccessibility:false\n' > run/options.txt
          LIBGL_ALWAYS_SOFTWARE=1 timeout --signal=INT --kill-after=30s 480s xvfb-run --auto-servernum ./gradlew --no-daemon -PcreateSmoke -PguiSmoke runClient --console=plain > gui-smoke.log 2>&1 || true
          tail -n 140 gui-smoke.log
          grep -q 'CART_GUI_CLIENT_OK' gui-smoke.log
          if grep -qE '(CART_GUI_CLIENT_FAILED|MixinApplyError|MixinTransformerError)' gui-smoke.log; then exit 1; fi
      - name: Upload tested release
        uses: actions/upload-artifact@v4
        with:
          name: AvilixLogger-2.1.22
          path: build/libs/avilixlogger-2.1.22.jar
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-2.1.22
          path: |
            create-smoke.log
            gui-smoke.log
            run/screenshots/cart-gui-*.png
            build/reports/
            build/obfuscation/mapping.txt
          if-no-files-found: ignore
