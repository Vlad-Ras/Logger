name: Build installable 2.1.33 binary
on:
  push:
    branches: [release/2.1.33]
permissions:
  contents: read
concurrency:
  group: avilixlogger-release-2.1.33
  cancel-in-progress: false
jobs:
  binary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ORG_GRADLE_PROJECT_compatCreateReleaseDirectory: build/compat-create-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare verified official Create release input
        run: python3 tools/ci/prepare-create-release.py
      - name: Validate pipelines, mixins and production obfuscation
        run: |
          set -euo pipefail
          ./gradlew testAsyncPipeline testCreatePreflight verifyMixinSafety verifyObfuscatedJar --no-daemon --console=plain 2>&1 | tee release-build.log
          test -s build/libs/avilixlogger-2.1.33.jar
          mkdir -p build/release-evidence
          grep -Fx 'mod_version=2.1.33' gradle.properties
          (cd build/libs && sha256sum avilixlogger-2.1.33.jar) > build/release-evidence/SHA256SUMS
          python3 - <<'PY'
          import tomllib
          import zipfile
          with zipfile.ZipFile("build/libs/avilixlogger-2.1.33.jar") as jar:
              metadata = tomllib.loads(jar.read("META-INF/neoforge.mods.toml").decode())
              assert any(mod["modId"] == "avilixlogger" and mod["version"] == "2.1.33" for mod in metadata["mods"])
          PY
          printf 'source_commit=%s\nbranch=%s\nfull_pack_profile=operator_environment_required\nauthcore_positive=operator_environment_required\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > build/release-evidence/BUILD.txt
      - name: Install clean NeoForge server for packaged JAR boot
        run: |
          set -euo pipefail
          neo_version=$(sed -n 's/^neo_version=//p' gradle.properties)
          curl --fail --location --retry 3 "https://maven.neoforged.net/releases/net/neoforged/neoforge/$neo_version/neoforge-$neo_version-installer.jar" -o build/neoforge-installer.jar
          mkdir -p build/release-server
          java -jar build/neoforge-installer.jar --installServer build/release-server > installer.log 2>&1
          mkdir -p build/release-server/mods
          cp build/libs/avilixlogger-2.1.33.jar build/release-server/mods/
          printf 'eula=true\n' > build/release-server/eula.txt
          printf 'server-ip=127.0.0.1\nserver-port=25579\nmax-tick-time=-1\nview-distance=2\nsimulation-distance=2\n' > build/release-server/server.properties
          printf '%s\n' '-Xms512m' '-Xmx1G' > build/release-server/user_jvm_args.txt
      - name: Boot actual obfuscated mod, verify fail-closed AuthCore and clean stop
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess,time,pathlib
          root=pathlib.Path('build/release-server').resolve()
          log=pathlib.Path('release-jar-boot.log').resolve()
          with log.open('w') as out:
              process=subprocess.Popen(['bash','run.sh','nogui'],cwd=root,stdin=subprocess.PIPE,stdout=out,stderr=subprocess.STDOUT,text=True)
              try:
                  deadline=time.monotonic()+210
                  while time.monotonic()<deadline:
                      text=log.read_text(errors='replace')
                      if 'Done (' in text and 'Authorization denied' in text:
                          assert not any(token in text for token in ['MixinApplyError','MixinTransformerError','NoClassDefFoundError']),'packaged runtime error'
                          process.stdin.write('stop\n');process.stdin.flush()
                          assert process.wait(timeout=60)==0,'server did not stop cleanly'
                          print('OBFUSCATED_JAR_BOOT_OK: actual production JAR, clean dedicated server, missing AuthCore denied, normal shutdown')
                          break
                      if process.poll() is not None:raise RuntimeError('server stopped before ready\n'+text[-10000:])
                      time.sleep(.5)
                  else:raise TimeoutError('packaged server startup timed out')
              finally:
                  if process.poll() is None:process.kill();process.wait()
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AvilixLogger-2.1.33
          path: |
            build/libs/avilixlogger-2.1.33.jar
            build/release-evidence/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-2.1.33-validation
          path: |
            release-build.log
            installer.log
            release-jar-boot.log

  publish:
    needs: binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AvilixLogger-2.1.33
          path: release
      - name: Verify artifact and publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          jar=release/libs/avilixlogger-2.1.33.jar
          evidence=release/release-evidence
          grep -Fx "source_commit=$GITHUB_SHA" "$evidence/BUILD.txt"
          (cd release/libs && sha256sum --check ../release-evidence/SHA256SUMS)
          cat > release-notes.md <<'EOF'
          AvilixLogger 2.1.33 для Minecraft 1.21.1 и NeoForge. Обновите JAR на сервере и клиенте. Серверные механики включаются после авторизации через AvilixAuthCore.

          - Журнал: точный поиск от даты и по интервалу, быстрый переход по страницам, навигация назад, скрытие действий по моду и типу. Добавлены подписи обработчиков и переход из записи к переключателю захвата.
          - Отчёты о клиентах: имена модов из метаданных, SHA-256 модов и ресурс-паков, поиск по имени и хэшу, экспорт JSON. Настраиваемые совпадения видны в отчёте, уведомления администратора включаются индивидуально.
          - Восстановление: контуры блоков, контейнеров и сущностей, история поездов Create, повторное применение поддерживаемых изменений блоков по игрокам и периоду.
          - Из GUI можно скачать latest.log, архивы логов и crash-отчёты. Телепорт из журнала использует точные координаты.
          - Сервер создаёт меньше повторных снимков Create. У клиентского предпросмотра меньше работы на кадр. Справка обновлена.

          Серверные проверки, реальный ClickHouse и клиентский GUI прошли на стендах CI. Производственные замеры полного модпака и проверка допуска на авторизованном сервере выполняются в среде оператора.
          EOF
          tag=v2.1.33
          if gh release view "$tag" --json isDraft,targetCommitish > existing-release.json; then
            jq -e --arg commit "$GITHUB_SHA" '.isDraft and .targetCommitish == $commit' existing-release.json
            gh release upload "$tag" "$jar" "$evidence/SHA256SUMS" "$evidence/BUILD.txt" --clobber
          else
            gh release create "$tag" "$jar" "$evidence/SHA256SUMS" "$evidence/BUILD.txt" \
              --draft --title "AvilixLogger 2.1.33" --target "$GITHUB_SHA" --notes-file release-notes.md
          fi
          gh release download "$tag" --dir verified-release
          (cd verified-release && sha256sum --check SHA256SUMS)
          cmp "$evidence/BUILD.txt" verified-release/BUILD.txt
          cmp "$evidence/SHA256SUMS" verified-release/SHA256SUMS
          gh release edit "$tag" --draft=false --latest
