name: Logger ClickHouse hotfix

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/logger-clickhouse-hotfix.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply ClickHouse compatibility fix
        run: python3 .github/logger_clickhouse_hotfix.py

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: AvilixLogger-clickhouse-hotfix
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Commit validated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/roften/avilixlogger/core/ClickHouseLogStorage.java
          git rm .github/logger-clickhouse-hotfix.patch
          git rm .github/logger_clickhouse_hotfix.py
          git rm .github/workflows/logger-clickhouse-hotfix.yml
          git commit -m 'Fix ClickHouse legacy fallback in split schema'
          git push origin HEAD:master
