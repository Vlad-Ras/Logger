buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.4.0'
    }
}

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.139'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    mavenCentral()

    // Modrinth Maven (LDLib2, etc.)
    maven { url = uri("https://api.modrinth.com/maven") }
    maven { url = uri("https://maven.createmod.net") }
    maven { url = uri("https://maven.ithundxr.dev/snapshots") }
    maven { url = uri("https://raw.githubusercontent.com/Fuzss/modresources/main/maven") }
    ivy {
        url = uri('https://github.com/MrCrayfish')
        patternLayout { artifact '[module]/releases/download/v[revision]/[artifact]-[revision]-signed.[ext]' }
        metadataSources { artifact() }
        content { includeGroup 'com.mrcrayfish.release' }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.create("createSmoke")
if (project.hasProperty('createAbsent')) sourceSets.createSmoke.java.include('**/CreateAbsentSmoke.java')
sourceSets.createSmoke.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
sourceSets.createSmoke.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            if (project.hasProperty('acceptanceJfr')) jvmArgument "-XX:StartFlightRecording=name=avilix_client,settings=profile,dumponexit=true,maxsize=64m,filename=${project.file('run/avilixlogger-client-ci.jfr').absolutePath}"
            if (project.hasProperty('guiSmoke')) systemProperty 'avilixlogger.guiSmoke', 'true'

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            if (project.hasProperty('acceptanceJfr')) jvmArgument "-XX:StartFlightRecording=name=avilix_server,settings=profile,dumponexit=true,maxsize=64m,filename=${project.file('run/avilixlogger-server-ci.jfr').absolutePath}"
            if (project.hasProperty('createSmoke')) {
                systemProperty 'avilixlogger.createSmoke', 'true'
                jvmArgument '-Xmx4G'
                jvmArgument '-XX:+ExitOnOutOfMemoryError'
            }
            if (project.hasProperty('createAbsent')) {
                systemProperty 'avilixlogger.createAbsentSmoke', 'true'
                gameDirectory = project.file('run-create-absent')
            }
            if (project.hasProperty('backpackSmoke')) systemProperty 'avilixlogger.backpackSmoke', 'true'
            if (project.hasProperty('backpackAbsent')) systemProperty 'avilixlogger.backpackAbsent', 'true'
            if (project.hasProperty('actorSmoke')) systemProperty 'avilixlogger.actorSmoke', 'true'
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            if (project.hasProperty('createSmoke') || project.hasProperty('createAbsent') || project.hasProperty('backpackSmoke') || project.hasProperty('actorSmoke') || project.hasProperty('guiSmoke')) sourceSet(sourceSets.createSmoke)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    if (project.hasProperty('actorSmoke') && !project.hasProperty('aircraftAbsent')) {
        localRuntime 'maven.modrinth:immersive-aircraft:RkWu0N4D' // NeoForge 1.21.1, IA 1.4.6
    }
    // Native food/container contract regression; optional and never bundled in production.
    if (project.hasProperty('createSmoke') && !project.hasProperty('createAbsent')) {
        def foodVersions = ['1.3.2': 'GbNuOZ4S', '1.3.4': 'XTVZDOol']
        def foodVersion = project.findProperty('fdSmokeVersion') ?: '1.3.4'
        if (!foodVersions.containsKey(foodVersion)) throw new GradleException("Unsupported FD smoke version: ${foodVersion}")
        localRuntime "maven.modrinth:farmers-delight:${foodVersions[foodVersion]}"
    }
    // Optional integration: never ship AE2 classes inside the logger JAR.
    def compatAe2Version = project.findProperty('compatAe2Version') ?: '19.2.12'
    compileOnly "org.appliedenergistics:appliedenergistics2:${compatAe2Version}"
    localRuntime "org.appliedenergistics:appliedenergistics2:${compatAe2Version}"
    // Optional Create integration. Never embed Create or its libraries in the logger.
    def compatCreateVersion = project.findProperty('compatCreateVersion') ?: '6.0.11-313'
    if (compatCreateVersion.startsWith('6.0.10-')) {
        // Old Create's POM publishes all development integrations as runtime dependencies.
        // Its real required libraries are explicit here; do not pull unrelated optional mods.
        compileOnly("com.simibubi.create:create-1.21.1:${compatCreateVersion}") { transitive = false }
        compileOnly 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'
        compileOnly 'net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1'
        compileOnly 'dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6'
        if (!project.hasProperty('createAbsent')) {
            localRuntime("com.simibubi.create:create-1.21.1:${compatCreateVersion}") { transitive = false }
            localRuntime 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'
            localRuntime 'net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1'
            localRuntime 'dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6'
        }
    } else {
        compileOnly "com.simibubi.create:create-1.21.1:${compatCreateVersion}"
        if (!project.hasProperty('createAbsent')) localRuntime "com.simibubi.create:create-1.21.1:${compatCreateVersion}"
    }
    // Official release artifacts, compile-only. Neither mod is bundled or required in production.
    [Backpacked: ['backpacked-neoforge', '1.21.1-3.0.5'], Framework: ['framework-neoforge', project.findProperty('compatFrameworkVersion') ?: '1.21.1-0.13.10']].each { module, spec ->
        def external = { artifact { name = spec[0]; type = 'jar' }; transitive = false }
        compileOnly("com.mrcrayfish.release:${module}:${spec[1]}", external)
        if ((project.hasProperty('backpackSmoke') || project.hasProperty('createSmoke') || project.hasProperty('guiSmoke')) && !project.hasProperty('backpackAbsent') && !project.hasProperty('createAbsent')) localRuntime("com.mrcrayfish.release:${module}:${spec[1]}", external)
    }
    // --- ClickHouse backend ---
    // Uses ClickHouse HTTP API via JDK HttpURLConnection. No ClickHouse JDBC dependency is needed.

    // --- Optional GUI library ---
    // IMPORTANT: do NOT embed LowDragLib2 (ldlib2) into this mod.
    // If ldlib2 is present on the dedicated server, clients without ldlib2 will be kicked during handshake
    // due to missing required network channels.
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.named('jar', Jar).configure {
    destinationDirectory = layout.buildDirectory.dir('tmp/unobfuscatedJar')
}

def releaseJar = layout.buildDirectory.file("libs/${base.archivesName.get()}-${project.version}.jar")
def proguardMapping = layout.buildDirectory.file('obfuscation/mapping.txt')
def proguardSeeds = layout.buildDirectory.file('obfuscation/seeds.txt')

tasks.register('obfuscateJar', proguard.gradle.ProGuardTask) {
    group = 'build'
    description = 'Obfuscates the production mod JAR after compilation.'
    notCompatibleWithConfigurationCache('ProGuard 7.4 uses Gradle project state during task execution.')
    dependsOn tasks.named('jar', Jar)

    doFirst {
        releaseJar.get().asFile.parentFile.mkdirs()
        proguardMapping.get().asFile.parentFile.mkdirs()
        proguardSeeds.get().asFile.parentFile.mkdirs()
        delete releaseJar.get().asFile
    }

    // Minecraft/NeoForge and every compile dependency are libraries: their public symbols must
    // remain untouched while references from this mod are rewritten.
    configuration file('proguard-rules.pro')
    injars(tasks.named('jar', Jar).flatMap { it.archiveFile })
    libraryjars sourceSets.main.compileClasspath
    libraryjars "${System.getProperty('java.home')}/jmods/java.base.jmod",
            jarfilter: '!**.jar', filter: '!module-info.class'
    outjars releaseJar
    printmapping proguardMapping
    printseeds proguardSeeds
}

tasks.register('verifyObfuscatedJar') {
    group = 'verification'
    description = 'Checks runtime-sensitive enum metadata in the obfuscated release JAR.'
    dependsOn tasks.named('obfuscateJar')

    doLast {
        def mappingText = proguardMapping.get().asFile.getText('UTF-8')
        def actionTypeMapping = mappingText =~ /(?m)^com\.roften\.avilixlogger\.core\.ActionType -> ([\w.$]+):$/
        if (!actionTypeMapping.find()) {
            throw new GradleException('ActionType is missing from the ProGuard mapping')
        }

        // Network/client boundaries invoke these methods by literal names after obfuscation.
        def hookClass = 'com.roften.avilixlogger.client.gui.LogViewerClientHooks'
        def hookStart = mappingText.indexOf(hookClass + ' -> ')
        if (hookStart < 0) throw new GradleException('Client hooks missing from ProGuard mapping')
        def hookEnd = mappingText.indexOf('\ncom.', hookStart + 1)
        def hookMapping = mappingText.substring(hookStart, hookEnd < 0 ? mappingText.length() : hookEnd)
        def networkSource = file('src/main/java/com/roften/avilixlogger/net/LoggerNetwork.java').getText('UTF-8')
        def hookCalls = networkSource =~ /invokeClientHook\("([^"\n]+)"/
        hookCalls.each { call ->
            def name = call[1]
            if (!(hookMapping =~ /(?m)\b${name}\([^\n]* -> ${name}\s*$/).find())
                throw new GradleException("Client hook renamed/missing after obfuscation: ${name}")
        }

        def actionTypeName = actionTypeMapping.group(1)
        def jarUrl = releaseJar.get().asFile.toURI().toURL()
        def loader = new URLClassLoader(([jarUrl] + sourceSets.main.runtimeClasspath.files.collect { it.toURI().toURL() }) as URL[], ClassLoader.getPlatformClassLoader())
        try {
            def actionType = Class.forName(actionTypeName, true, loader)
            def constants = actionType.getEnumConstants()
            if (!actionType.isEnum() || constants == null || constants.length == 0) {
                throw new GradleException('ProGuard broke ActionType enum reflection required by EnumMap/EnumSet')
            }
            def rowMapping = mappingText =~ /(?m)^com\.roften\.avilixlogger\.core\.LogEntry -> ([\w.$]+):$/
            if (!rowMapping.find()) throw new GradleException('LogEntry missing from ProGuard mapping')
            def rowType = Class.forName(rowMapping.group(1), false, loader)
            ['id', 'ts', 'dim', 'type', 'actorUuid', 'actorName', 'source', 'x', 'y', 'z',
             'blockBefore', 'beBefore', 'blockAfter', 'beAfter', 'entityType', 'entityUuid', 'entityNbt',
             'itemStackNbt', 'count', 'playerInvBefore', 'playerInvAfter', 'containerSlotsBefore',
             'containerSlotsAfter', 'extra'].each { rowType.getField(it) }
        } finally {
            loader.close()
        }
    }
}

tasks.register('verifyMixinSafety') {
    group = 'verification'
    description = 'Rejects instance collection initializers that Mixin may omit from target constructors.'

    doLast {
        def unsafePattern = ~/(?s)@Unique\s+private\s+final\s+(?:Deque|Queue|List|Set|Map)<[^;]+?=\s*new\s+/
        def unsafeFiles = fileTree('src/main/java') {
            include '**/*Mixin.java'
        }.findAll { unsafePattern.matcher(it.getText('UTF-8')).find() }

        def networkSource = file('src/main/java/com/roften/avilixlogger/net/LoggerNetwork.java').getText('UTF-8')
        def rules = file('proguard-rules.pro').getText('UTF-8')
        def hooks = networkSource =~ /invokeClientHook\("([^"\n]+)"/
        hooks.each { call ->
            if (!rules.contains("public static void ${call[1]}(...);"))
                throw new GradleException("Reflection client hook lacks keep rule: ${call[1]}")
        }

        fileTree('src/main/java/com/roften/avilixlogger/compat/create/mixin') { include '**/*.java' }.each { source ->
            if(source.getText('UTF-8').contains('CreateDeployerAudit.capture('))
                throw new GradleException("Production mixin bypasses live capture policy: ${source.name}")
        }
        if (!unsafeFiles.isEmpty()) {
            throw new GradleException('Unsafe mixin instance collection initializer(s): '
                    + unsafeFiles.collect { project.relativePath(it) }.join(', '))
        }
    }
}

tasks.named('assemble').configure {
    dependsOn tasks.named('obfuscateJar')
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyObfuscatedJar')
    dependsOn tasks.named('verifyMixinSafety')
    dependsOn 'testAsyncPipeline'
}

tasks.register('testNativeClickHouse', JavaExec) {
    group = 'verification'
    description = 'Runs a real ClickHouse schema/flush/lookup/restart integration, with no AuthCore bypass.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.roften.avilixlogger.core.ClickHouseNativeSmoke'
}

tasks.register('testAsyncPipeline', JavaExec) {
    group = 'verification'
    description = 'Checks bounded asynchronous handoff without a database or Minecraft server.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.roften.avilixlogger.core.AsyncPipelineTest'
}

tasks.register('testCreatePreflight', JavaExec) {
    group = 'verification'
    description = 'Checks raw Create mixin targets and injected compatibility faults without initializing Minecraft.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'com.roften.avilixlogger.core.CreatePreflightTest'
}
